<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="./images/movie logo.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Flix
    </title>
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- OWL CAROUSEL -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" integrity="sha512-tS3S5qG0BlhnQROyJXvNjeEM4UpMXHrQfTGmbQ1gKmelCxlSEBUaxhRBj/EFTzpbP4RVSrpEikbmdJobCvhE3g==" crossorigin="anonymous" />
    <!-- BOX ICONS -->
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
    <!-- APP CSS -->
    <link rel="stylesheet" href="grid.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>
  <!--preloading-->
  <div id="preloader">
    <img class="logo" src="images/logo1.png" alt="" width="119" height="58">
    <div id="status">
      <span></span>
      <span></span>
    </div>
  </div>
  <!--end of preloading-->
  <!--login form popup-->
  <div class="login-wrapper" id="login-content">
    <div class="login-content">
      <a href="#" class="close">x</a>
      <h3>Login</h3>
      <form method="post" action="#">
        <div class="row">
          <label for="username">
            Username:
            <input type="text" name="username" id="username" placeholder="Hugh Jackman"
              pattern="^[a-zA-Z][a-zA-Z0-9-_\.]{8,20}$" required="required" />
          </label>
        </div>

        <div class="row">
          <label for="password">
            Password:
            <input type="password" name="password" id="password" placeholder="******"
              pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required="required" />
          </label>
        </div>
        <div class="row">
          <div class="remember">
            <div>
              <input type="checkbox" name="remember" value="Remember me"><span>Remember me</span>
            </div>
            <a href="#">Forget password ?</a>
          </div>
        </div>
        <div class="row">
          <button type="submit">Login</button>
        </div>
      </form>
      <div class="row">
        <p>Or via social</p>
        <div class="social-btn-2">
          <a class="fb" href="#"><i class="ion-social-facebook"></i>Facebook</a>
          <a class="tw" href="#"><i class="ion-social-twitter"></i>twitter</a>
        </div>
      </div>
    </div>
  </div>
  <!--end of login form popup-->
  <!--signup form popup-->
  <div class="login-wrapper" id="signup-content">
    <div class="login-content">
      <a href="#" class="close">x</a>
      <h3>sign up</h3>
      <form method="post" action="#">
        <div class="row">
          <label for="username-2">
            Username:
            <input type="text" name="username" id="username-2" placeholder="Hugh Jackman"
              pattern="^[a-zA-Z][a-zA-Z0-9-_\.]{8,20}$" required="required" />
          </label>
        </div>

        <div class="row">
          <label for="email-2">
            your email:
            <input type="password" name="email" id="email-2" placeholder=""
              pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required="required" />
          </label>
        </div>
        <div class="row">
          <label for="password-2">
            Password:
            <input type="password" name="password" id="password-2" placeholder=""
              pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required="required" />
          </label>
        </div>
        <div class="row">
          <label for="repassword-2">
            re-type Password:
            <input type="password" name="password" id="repassword-2" placeholder=""
              pattern="(?=^.{8,}$)((?=.*\d)|(?=.*\W+))(?![.\n])(?=.*[A-Z])(?=.*[a-z]).*$" required="required" />
          </label>
        </div>
        <div class="row">
          <button type="submit">sign up</button>
        </div>
      </form>
    </div>
  </div>
  <!--end of signup form popup-->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script src="js/jquery.js"></script>
  <script src="js/plugins.js"></script>
  <script src="js/plugins2.js"></script>
  <script src="js/custom.js"></script>
</body>

</html>
